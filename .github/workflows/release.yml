name: Release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - name: Package app bundle
        run: |
          mkdir -p dist
          (cd src && zip -qr ../dist/gogure-do-${GITHUB_REF_NAME}.zip .)
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~20)..HEAD > CHANGELOG-cut.txt || true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/gogure-do-*.zip
